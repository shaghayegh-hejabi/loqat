<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="لغات">
<title>کارت لغات آلمانی</title>
<style>
:root{--bg:#f5f5f7;--fg:#1c1c1e;--card:#fff;--ac:#0a84ff;--mut:#8e8e93;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--card:#1c1c1e}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,Tahoma,sans-serif}
#app{max-width:480px;margin:auto;padding:16px}h1{font-size:22px;margin:8px 0 16px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-family:inherit}
.sec{background:var(--card);color:var(--fg)}
.deck{background:var(--card);border-radius:14px;padding:16px;margin:10px 0;display:flex;justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
#card{background:var(--card);border-radius:22px;height:50vh;display:flex;align-items:center;justify-content:center;text-align:center;font-size:32px;padding:20px;margin:18px 0;box-shadow:0 4px 18px #0002;word-break:break-word}
.back{color:var(--ac)}label{display:flex;justify-content:space-between;background:var(--card);padding:14px;border-radius:12px;margin:10px 0}
</style></head><body><div id="app"></div>
<script>
let D={},P={swap:false,auto:false},cur,idx=0,flip=false,order=[];
try{P=Object.assign(P,JSON.parse(localStorage.getItem('gp')||'{}'))}catch(e){}
const sp=()=>{try{localStorage.setItem('gp',JSON.stringify(P))}catch(e){}};
const $=document.getElementById('app'),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
async function load(){try{const r=await fetch('data.json',{cache:'no-store'});D=await r.json();try{localStorage.setItem('gd',JSON.stringify(D))}catch(e){}}
catch(e){try{D=JSON.parse(localStorage.getItem('gd')||'{}')}catch(_){}}home()}
async function say(c){try{if(c.a){const r=await fetch('audio/'+c.a);if(r.ok){const u=URL.createObjectURL(await r.blob());await new Audio(u).play();return}}}catch(e){}
try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c.de);u.lang='de-DE';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function home(){cur=null;$.innerHTML=`<div class="row"><h1>📚 پوشه‌ها</h1><button class="sec" onclick="sett()">⚙️</button></div>`+
(Object.keys(D).map(n=>`<div class="deck" onclick="op('${encodeURIComponent(n)}')"><b>${esc(n)}</b><span class="mut">${D[n].length} لغت</span></div>`).join('')||'<p class="mut">لغتی نیست.</p>')}
function op(n){cur=decodeURIComponent(n);order=D[cur].map((_,i)=>i);idx=0;flip=false;st()}
function st(){const c=D[cur][order[idx]],fr=P.swap?c.fa:c.de,bk=P.swap?c.de:c.fa;
$.innerHTML=`<div class="row"><button class="sec" onclick="home()">→ بازگشت</button><span class="mut">${idx+1} / ${D[cur].length}</span><button class="sec" onclick="sh()">🔀</button></div>
<div id="card" dir="auto" onclick="fl()">${flip?`<span class="back">${esc(bk||'—')}</span>`:esc(fr||'—')}</div>
<div class="row"><button onclick="mv(1)">◀︎ بعدی</button><button class="sec" onclick="say(D[cur][order[idx]])">🔊 تلفظ</button><button onclick="mv(-1)">قبلی ▶︎</button></div>`;
if(P.auto&&!flip&&!P.swap)say(c)}
function fl(){flip=!flip;st();if(flip&&P.swap)say(D[cur][order[idx]])}
function mv(d){const n=D[cur].length;idx=(idx+d+n)%n;flip=false;st()}
function sh(){order.sort(()=>Math.random()-.5);idx=0;flip=false;st()}
function sett(){$.innerHTML=`<h1>⚙️ تنظیمات</h1>
<label>جلوی کارت فارسی، پشت آلمانی<input type="checkbox" ${P.swap?'checked':''} onchange="P.swap=this.checked;sp()"></label>
<label>پخش خودکار تلفظ<input type="checkbox" ${P.auto?'checked':''} onchange="P.auto=this.checked;sp()"></label>
<p><button onclick="home()">بازگشت</button></p>`}
load();
</script></body></html>
